# Environnement de développement Naneu Shop.
#
#   docker compose up -d --build
#
#   Application   http://localhost:8088
#   pgAdmin       http://localhost:5050
#   PostgreSQL    localhost:5433 (5432 est pris par un PostgreSQL local)
#
# Les secrets viennent du fichier .env (Compose le lit automatiquement).

x-app: &app
  image: naneu-shop-app
  # Construite une seule fois par le service app, réutilisée par les autres.
  pull_policy: never
  volumes:
    - .:/app
    # Le dossier Windows monté est lent (des milliers de fichiers lus par
    # requête) : dépendances et cache des vues restent dans des volumes Docker.
    - vendor:/app/vendor
    - framework:/app/storage/framework
  environment:
    # Dans le réseau Docker, les services se joignent par leur nom.
    DB_HOST: db
    DB_PORT: 5432
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    APP_URL: http://localhost:8088
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    pull_policy: build
    ports:
      - "8088:80"

  queue:
    <<: *app
    healthcheck:
      disable: true
    command: php artisan queue:work --sleep=2 --tries=3 --max-time=3600

  scheduler:
    <<: *app
    healthcheck:
      disable: true
    command: php artisan schedule:work

  reverb:
    <<: *app
    healthcheck:
      disable: true
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Africa/Lome
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmindata:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - db
    restart: unless-stopped


volumes:
  vendor:
  framework:
  pgdata:
  pgadmindata:
