memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 60
date.timezone = Africa/Lome

; Jamais d'erreur PHP affichée au visiteur : elles vont dans les journaux.
display_errors = Off
log_errors = On
expose_php = Off

; Le code ne change pas dans une image : PHP ne relit pas les fichiers.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
