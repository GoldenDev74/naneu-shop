# Vhost Apache de Grafana : https://surveillance.naneushop.com
#
# Installation (en root), une fois l'enregistrement DNS créé chez OVH
# (A surveillance -> 164.132.40.128, AAAA -> 2001:41d0:305:2100::1:2a6b) :
#
#   cp surveillance.conf /etc/apache2/sites-available/surveillance.conf
#   a2ensite surveillance && apache2ctl configtest && systemctl reload apache2
#   certbot --apache -d surveillance.naneushop.com --redirect
#
# Certbot crée surveillance-le-ssl.conf (HTTPS) à partir de ce fichier.
# Grafana gère lui-même la connexion (mot de passe, verrouillage après échecs).

<VirtualHost *:80>
    ServerName surveillance.naneushop.com

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https" env=HTTPS

    # Grafana Live (mises à jour en direct) passe par WebSocket.
    ProxyPass        /api/live/ ws://127.0.0.1:3000/api/live/ upgrade=websocket
    ProxyPassReverse /api/live/ ws://127.0.0.1:3000/api/live/

    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    Header always set X-Robots-Tag "noindex, nofollow"

    ErrorLog  ${APACHE_LOG_DIR}/surveillance_error.log
    CustomLog ${APACHE_LOG_DIR}/surveillance_access.log combined
</VirtualHost>
