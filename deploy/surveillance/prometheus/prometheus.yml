global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: machine
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: conteneurs
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
